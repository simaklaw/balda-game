<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#10161f" />
    <title>Балда</title>
    <meta name="description" content="Балда — словесная игра: офлайн с ИИ и онлайн с рейтингом. Яндекс, VK, Telegram." />
    <meta name="color-scheme" content="dark light" />
    <link rel="manifest" href="./manifest.json" />
    <style>
      :root {
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #10161f;
        overflow: hidden;
        overscroll-behavior: none;
      }
      body {
        position: fixed;
        inset: 0;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      canvas {
        display: block;
        touch-action: none;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      @media (orientation: landscape) {
        html, body {
          width: 100vw;
          height: 100vh;
        }
      }
      /* DOM-оверлей загрузки: гарантированно отрисовывается до тяжёлой
         синхронной сборки словаря (Pixi-заглушка первый кадр не показывала). */
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #10161f;
        color: #9aa7b8;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        font-size: 16px;
        z-index: 10;
      }
      #boot .boot-spinner {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 3px solid #2a3547;
        border-top-color: #4da3ff;
        animation: boot-spin 0.9s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .boot-spinner {
          animation: none;
          border-top-color: #4da3ff;
        }
      }
      /* Баннер деградации словаря: dev-набор вместо полного words.txt. */
      #dict-banner {
        position: fixed;
        left: 12px;
        right: 12px;
        bottom: calc(12px + var(--safe-bottom));
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 10px 14px;
        border-radius: 12px;
        background: #3a2d12;
        color: #ffd479;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        font-size: 13px;
        z-index: 9;
      }
      #dict-banner button {
        padding: 6px 14px;
        border: none;
        border-radius: 8px;
        background: #ffd479;
        color: #1c1503;
        font-size: 13px;
        font-weight: 600;
      }
      #dict-banner button:disabled {
        opacity: 0.5;
      }
    </style>
    <!-- SDK Telegram Mini Apps: создаёт window.Telegram.WebApp до старта игры. -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <h1 class="sr-only">Балда — словесная игра</h1>
    <div id="boot">
      <div class="boot-spinner"></div>
      <div id="boot-text" role="status" aria-live="polite">Загрузка…</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
