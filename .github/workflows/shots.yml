name: shots (временный)
on:
  push:
    branches: [shots]
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - run: |
          (cd client/dist && python3 -m http.server 8080 >/dev/null 2>&1 &)
          sleep 2
          mkdir -p shots
          node scripts/shots.mjs
      - run: |
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add -f shots/*.png
          git commit -m "shots" || exit 0
          git push origin HEAD:shots
