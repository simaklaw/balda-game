name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Без fallback на npm install: рассинхрон package-lock.json должен
      # ломать CI сразу, а не маскироваться «как-нибудь установилось».
      - run: npm ci
      - run: npm run lint --if-present
      - name: Typecheck
        run: npm run typecheck --if-present
      - name: Test
        run: |
          set -o pipefail
          npm test --if-present 2>&1 | tee /tmp/test.log
      - name: Test failure details
        if: failure()
        run: |
          LINES=$(wc -l < /tmp/test.log)
          echo "::notice::test log lines: $LINES"
          tail -n 400 /tmp/test.log | grep -v '^\s*$' | tail -n 12 | cut -c1-900 | while IFS= read -r line; do
            echo "::error::$line"
          done
      - run: npm run build --if-present
      - name: Проверка dist (относительные пути, словарь, бюджеты)
        run: node scripts/check-dist.mjs

  audit:
    # Отчёт по уязвимостям зависимостей: сначала собираем данные (не блокирует), решение о блокировке — после разбора.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: npm audit (все зависимости и только production) — сводка
        continue-on-error: true
        run: |
          npm audit --json > /tmp/audit-all.json || true
          npm audit --omit=dev --json > /tmp/audit-prod.json || true
          node scripts/audit-summary.mjs /tmp/audit-all.json /tmp/audit-prod.json
      - uses: actions/upload-artifact@v4
        with:
          name: npm-audit
          path: /tmp/audit-*.json

  dictionary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Пайплайн использует только стандартную библиотеку Python (requirements.txt не нужен).
      - name: Юнит-тесты пайплайна словаря
        run: python3 -I -m unittest discover -s tools/dict -p 'test_*.py'
      - name: Воспроизводимость (пересборка == закоммиченный words.txt)
        run: python3 -I tools/dict/verify.py
      - name: KPI словаря
        run: node scripts/dict-kpi.mjs

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Smoke — два WS-клиента играют против сервера
        run: |
          npx tsx server/src/index.ts > /tmp/server.log 2>&1 &
          SRV=$!
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3001/health >/dev/null && break
            sleep 1
          done
          set +e
          node scripts/smoke.mjs > /tmp/smoke.log 2>&1
          CODE=$?
          cat /tmp/smoke.log
          if [ $CODE -ne 0 ]; then
            echo '::error::=== smoke провален ==='
            tail -n 40 /tmp/smoke.log | cut -c1-300 | while IFS= read -r line; do echo "::error::$line"; done
            echo '::error::=== лог сервера ==='
            tail -n 40 /tmp/server.log | cut -c1-300 | while IFS= read -r line; do echo "::error::$line"; done
            kill $SRV 2>/dev/null || true
            exit 1
          fi
          kill $SRV 2>/dev/null || true

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker build
        run: docker build -t balda-server .
